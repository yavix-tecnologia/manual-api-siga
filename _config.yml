title: Manual de Integração — SIGA
description: >-
  Como integrar seu sistema à API do SIGA: onboarding de colaborador e
  agendamento de exame ocupacional, do primeiro curl à guia em PDF.
lang: pt-BR

# GitHub Pages roda Jekyll nativamente com remote_theme — sem Actions, sem passo
# de build: escreveu markdown e deu push, publicou.
remote_theme: just-the-docs/just-the-docs

url: https://yavix-tecnologia.github.io
baseurl: /manual-api-siga

# --- just-the-docs ---
search_enabled: true
search:
  heading_level: 2
  previews: 2
  tokenizer_separator: /[\s/]+/
heading_anchors: true
color_scheme: siga

aux_links:
  "Referência da API (Scalar)":
    - "https://api-sst.yavix.app/docs"
  "Yavix":
    - "https://yavix.com.br"
aux_links_new_tab: true

footer_content: >-
  Yavix Tecnologia — SIGA. Dúvidas de integração:
  <a href="mailto:suporte@yavix.com.br">suporte@yavix.com.br</a>.

back_to_top: true
back_to_top_text: "Voltar ao topo"

# Base da API usada em TODOS os exemplos. Trocar aqui muda o manual inteiro.
siga:
  api_base: https://api-sst.yavix.app
  api_prefix: /api/v1

plugins:
  # jekyll-remote-theme: o GitHub Pages resolve `remote_theme` sozinho, mas o
  # build local (Jekyll 4) precisa do plugin declarado — sem ele o site sai sem
  # layout nenhum e o erro é silencioso.
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-include-cache

exclude:
  - Gemfile
  - Gemfile.lock
  - scripts/
  - README.md
